spring.application.name=mandate-lens
server.port=${MANDATELENS_PORT:8081}

# The first split keeps the existing local PostgreSQL database during migration.
# Mandate Lens is the only service that runs Flyway migrations.
spring.flyway.enabled=true

# Mandate Lens checks submitted cart facts against the merchant's live catalog API.
merchant.api.base-url=${MERCHANT_API_BASE_URL:http://127.0.0.1:8080}
