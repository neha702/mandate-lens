spring.application.name=pacepoint-merchant
server.port=${MERCHANT_PORT:8080}

# Merchant and Mandate Lens use the existing shared local database for this first split.
# Only Mandate Lens applies migrations; a later step can give each service its own database.
spring.flyway.enabled=false

mandatelens.api.base-url=${MANDATELENS_API_BASE_URL:http://127.0.0.1:8081}
merchant.demo.merchant-id=${AGENTGUARD_DEMO_MERCHANT_ID:STRIDEHUB}
merchant.demo.journey-id=${AGENTGUARD_DEMO_JOURNEY_ID:demo-shoes-001}
merchant.demo.mandate-id=${AGENTGUARD_DEMO_MANDATE_ID:mandate-demo-shoes-001}
