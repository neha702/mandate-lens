# Local-only Store Sync simulator. This profile has no PayPal JWT verification.
# Binding to loopback prevents accidental exposure while protocol onboarding is pending.
server.address=127.0.0.1

# Load local-only Sandbox credentials from the ignored repository-root .env file.
spring.config.import=optional:file:.env[.properties]

# Orders v2 defaults to PayPal Sandbox. Keep credentials in the process environment.
paypal.orders.base-url=${PAYPAL_ORDERS_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.orders.client-id=${PAYPAL_ORDERS_CLIENT_ID:}
paypal.orders.client-secret=${PAYPAL_ORDERS_CLIENT_SECRET:}

# AgentGuard service and local-demo correlation. Calls are loopback-only until authentication is specified.
agentguard.base-url=${AGENTGUARD_BASE_URL:}
agentguard.demo.journey-id=${AGENTGUARD_DEMO_JOURNEY_ID:demo-shoes-001}
