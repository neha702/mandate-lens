spring.application.name=agentpulse
server.port=8080

# PostgreSQL connection settings (provide DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mandatelens}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.schemas=merchant,trust
spring.flyway.default-schema=trust
